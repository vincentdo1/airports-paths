# Fly.io deployment for the airport routing service.
#
# First time:
#   fly launch --no-deploy      # creates the app; pick a unique name + region
#   fly deploy                  # builds the Dockerfile and ships it
#
# Fly terminates HTTPS in front of the service (required: GitHub Pages is HTTPS and
# can't call an HTTP API), so the browser client talks to https://<app>.fly.dev.

app = "airport-routing"   # change to your own globally-unique app name
primary_region = "iad"    # pick a region near you (see: fly platform regions)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080          # matches PORT in the Dockerfile
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0      # scales to zero when idle; set to 1 to avoid cold starts

  [[http_service.checks]]
    method = "GET"
    path = "/readyz"
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
