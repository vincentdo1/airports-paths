app = "airport-routing-vmd306"

primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080          # matches PORT in the Dockerfile
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0      # set to 1 to avoid cold starts

  [[http_service.checks]]
    method = "GET"
    path = "/readyz"
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
