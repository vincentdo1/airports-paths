name: Frontend CI

on:
  push:
    paths:
      - "visual-graph/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "visual-graph/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visual-graph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: visual-graph/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test -- --watchAll=false
      - name: Build
        run: npm run build
